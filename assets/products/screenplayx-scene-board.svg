    <text x="577" y="434" fill="#c5c0cb" font-family="Arial, sans-serif" font-size="11">LOCATION</text>
    <text x="738" y="434" fill="#f0f1eb" font-family="Arial, sans-serif" font-size="11">Kitchen · interior</text>
    <text x="577" y="474" fill="#c5c0cb" font-family="Arial, sans-serif" font-size="11">PROPS</text>
